<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>計算ドリル</title>
<link rel="stylesheet" href="style.css">
<script>/* apply the saved Light / Night choice before the page is drawn (no flash) */
try { var t = JSON.parse(localStorage.getItem('fqm.theme')); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) {}</script>
</head>
<body>
<header class="top">
  <div class="brand"><span class="logo">円</span><span>計算ドリル<small id="brandSub"></small></span></div>
  <nav class="seg" id="nav">
    <button data-tab="practice" class="on" data-i18n="nav.practice"></button>
    <button data-tab="test" data-i18n="nav.test"></button>
    <button data-tab="import" data-i18n="nav.import"></button>
    <button data-tab="editor" data-i18n="nav.editor"></button>
    <button data-tab="sheet" data-i18n="nav.sheet"></button>
  </nav>
  <div class="topright">
    <div class="seg sm icons" id="theme"><button data-set="auto"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor"/></svg></button><button data-set="light"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button><button data-set="dark"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M20.5 14.6A8.5 8.5 0 0 1 9.4 3.5a8.5 8.5 0 1 0 11.1 11.1z"/></svg></button></div>
    <div class="seg sm" id="lang"><button data-lang="en">EN</button><button data-lang="ja">日本語</button></div></div>
</header>
<main>
  <section id="practice" class="page">
    <div class="hero"><h1 data-i18n="practice.h"></h1><p data-i18n="practice.p"></p></div>
    <div id="pexams"></div>
    <div class="pgrid">
      <aside id="cats" class="card catbox"></aside>
      <div class="pmain"><div id="ptool" class="toolbar"></div><article id="card" class="card qcard"></article></div>
    </div>
  </section>
  <section id="test" class="page narrow" hidden></section>
  <section id="import" class="page narrow" hidden></section>
  <section id="editor" class="page wide" hidden></section>
  <section id="sheet" class="page" hidden></section>
</main>
<script src="templates.js"></script>
<script src="engine.js"></script>
<script src="app.js"></script>
</body>
</html>
